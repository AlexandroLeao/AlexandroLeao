kflows and AI-powered</text><text x="27" y="262" fill="#C9F2DF" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">features. I approach development from</text><text x="27" y="289" fill="#C9F2DF" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">understanding requirements and designing</text><text x="27" y="316" fill="#C9F2DF" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">solutions to automated testing, documentation</text><text x="27" y="343" fill="#C9F2DF" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">and deployment.</text></svg>